<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Student Responses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Student Response Dashboard</h1>
                <p class="text-gray-600">Module: Virtue, Harmony, and Sustainability</p>
            </div>
            <div class="flex gap-4">
                <button id="refreshBtn" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition">Refresh Data</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Total Submissions</p>
                <p id="totalSubmissions" class="text-3xl font-bold text-blue-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Last Submission</p>
                <p id="lastSubmission" class="text-lg font-semibold text-gray-700">None yet</p>
            </div>
             <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 text-sm text-gray-500 italic">
                Note: This dashboard requires access to the Firebase project.
            </div>
        </div>

        <!-- Filter -->
        <div class="bg-white p-4 rounded-t-xl border border-b-0 border-gray-200 flex gap-4 items-center">
            <label for="sectionFilter" class="font-bold text-gray-700">Filter by Section:</label>
            <select id="sectionFilter" class="border rounded px-3 py-1 bg-gray-50">
                <option value="all">All Sections</option>
                <option value="12 - Newton">12 - Newton</option>
                <option value="12 - Curie">12 - Curie</option>
                <option value="12 - Archerfish">12 - Archerfish</option>
            </select>
        </div>

        <!-- Responses Table -->
        <div class="bg-white rounded-b-xl shadow-md overflow-hidden border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Section</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quiz Score</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Submitted At</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="responseTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Data rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-8 shadow-2xl">
            <div class="flex justify-between items-start mb-6">
                <h2 id="modalTitle" class="text-2xl font-bold">Submission Details</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-3xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-6">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCboBLLJa2L4_0bQMsFZhnlxFu-Djm0OLM",
          authDomain: "easyquizmaker.firebaseapp.com",
          projectId: "easyquizmaker",
          storageBucket: "easyquizmaker.firebasestorage.app",
          messagingSenderId: "45502490490",
          appId: "1:45502490490:web:6edcfe535ad10094cc58c3",
          measurementId: "G-C6PJBZ85E2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ANSWER_KEY = {
            q1: 'B', q2: 'A', q3: 'C', q4: 'B', q5: 'B',
            q6: 'B', q7: 'B', q8: 'B', q9: 'B', q10: 'B'
        };

        let allResponses = [];

        function calculateScore(quiz) {
            let score = 0;
            for (let i = 1; i <= 10; i++) {
                if (quiz[`q${i}`] === ANSWER_KEY[`q${i}`]) {
                    score++;
                }
            }
            return score;
        }

        async function fetchData() {
            const tableBody = document.getElementById('responseTableBody');
            tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading data...</td></tr>';

            try {
                const q = query(collection(db, "student_responses"), orderBy("submittedAt", "desc"));
                const querySnapshot = await getDocs(q);
                allResponses = [];

                querySnapshot.forEach((doc) => {
                    allResponses.push({ id: doc.id, ...doc.data() });
                });

                renderTable(allResponses);
                updateStats(allResponses);
            } catch (error) {
                console.error("Error fetching documents: ", error);
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500 font-bold">Error loading data. Check Firestore rules.</td></tr>';
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById('responseTableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No submissions found.</td></tr>';
                return;
            }

            data.forEach((res) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';

                const studentName = `${res.student.surname}, ${res.student.firstName} ${res.student.middleName || ''}`;
                const date = res.submittedAt ? res.submittedAt.toDate().toLocaleString() : 'N/A';
                const score = calculateScore(res.quiz);

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${studentName}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">${res.student.section}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-blue-600">${score} / 10</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-sm">${date}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <button onclick="window.viewDetails('${res.id}')" class="text-blue-600 hover:text-blue-900 font-bold">View Answers</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateStats(data) {
            document.getElementById('totalSubmissions').innerText = data.length;
            if (data.length > 0 && data[0].submittedAt) {
                document.getElementById('lastSubmission').innerText = data[0].submittedAt.toDate().toLocaleString();
            }
        }

        // Global functions for modal
        window.viewDetails = (id) => {
            const res = allResponses.find(r => r.id === id);
            if (!res) return;

            const score = calculateScore(res.quiz);
            document.getElementById('modalTitle').innerText = `${res.student.surname}, ${res.student.firstName}`;
            const content = document.getElementById('modalContent');

            let quizHtml = '<div class="grid grid-cols-2 md:grid-cols-5 gap-2">';
            for (let i = 1; i <= 10; i++) {
                const answer = res.quiz[`q${i}`] || 'N/A';
                const isCorrect = answer === ANSWER_KEY[`q${i}`];
                const bgColor = isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200';
                quizHtml += `<div class="p-2 border rounded ${bgColor} text-center">
                    <span class="block text-xs font-bold text-gray-400">Q${i}</span>
                    <span class="text-lg font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}">${answer}</span>
                    ${!isCorrect ? `<span class="block text-[10px] text-gray-400">Key: ${ANSWER_KEY[`q${i}`]}</span>` : ''}
                </div>`;
            }
            quizHtml += '</div>';

            content.innerHTML = `
                <div class="flex justify-between items-center bg-blue-50 p-4 rounded-lg">
                    <div>
                        <h3 class="font-bold text-blue-800">Part A: Quiz Score</h3>
                        <p class="text-3xl font-black text-blue-600">${score} <span class="text-sm font-normal text-blue-400">/ 10 points</span></p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-gray-700">Total Possible Grade</h3>
                        <p class="text-xl font-bold text-gray-900">20 Points</p>
                    </div>
                </div>

                <div class="border-b pb-4">
                    <h3 class="font-bold text-gray-700 uppercase mb-2">Detailed Quiz Responses</h3>
                    ${quizHtml}
                </div>

                <!-- Rubric for Activity -->
                <div class="bg-gray-50 p-6 rounded-xl border border-gray-200">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        Teacher Rubric: Final Kosmos Plan (Max 10 pts)
                    </h3>
                    <table class="w-full text-sm bg-white border">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="p-2 border text-left">Criteria</th>
                                <th class="p-2 border text-center">Score</th>
                                <th class="p-2 border text-left">Requirement</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="p-2 border font-semibold">Philosophical Grounding</td>
                                <td class="p-2 border text-center font-bold text-blue-600">4 pts</td>
                                <td class="p-2 border text-gray-500">Correct use of: Kosmos, Demiurge, Sympatheia, and Peras.</td>
                            </tr>
                            <tr>
                                <td class="p-2 border font-semibold">Practical Clarity</td>
                                <td class="p-2 border text-center font-bold text-blue-600">3 pts</td>
                                <td class="p-2 border text-gray-500">Proposed actions are specific, realistic, and achievable.</td>
                            </tr>
                            <tr>
                                <td class="p-2 border font-semibold">MELC Alignment</td>
                                <td class="p-2 border text-center font-bold text-blue-600">3 pts</td>
                                <td class="p-2 border text-gray-500">Covers: Aesthetic organization, Health/Well-being, and Frugality.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-b pb-4">
                    <div>
                        <h3 class="font-bold text-gray-700 mb-1 text-sm">FA 1: The Chaos</h3>
                        <p class="text-gray-600 bg-white border p-3 rounded text-sm">${res.formativeAssessments.fa1.q1}</p>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-700 mb-1 text-sm">FA 1: Reflection</h3>
                        <p class="text-gray-600 bg-white border p-3 rounded text-sm">${res.formativeAssessments.fa1.q2}</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-b pb-4">
                    <div>
                        <h3 class="font-bold text-gray-700 mb-1 text-sm">FA 2: Action</h3>
                        <p class="text-gray-600 bg-white border p-3 rounded text-sm">${res.formativeAssessments.fa2.q1}</p>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-700 mb-1 text-sm">FA 2: Sympathy Definition</h3>
                        <p class="text-gray-600 bg-white border p-3 rounded text-sm">${res.formativeAssessments.fa2.q2}</p>
                    </div>
                </div>
                <div class="border-b pb-4">
                     <h3 class="font-bold text-gray-700 mb-1 text-sm">FA 3: Peras Choice Analysis</h3>
                     <p class="text-gray-600 bg-white border p-3 rounded text-sm">${res.formativeAssessments.fa3.q1}</p>
                </div>
                <div>
                    <h3 class="font-bold text-gray-700 uppercase mb-4 text-sm">Final Kosmos Plan</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="p-3 bg-blue-50 border border-blue-100 rounded">
                            <h4 class="font-bold text-xs text-blue-400 uppercase mb-1">Column 1: Kosmos</h4>
                            ${res.finalPlan.column1}
                        </div>
                        <div class="p-3 bg-green-50 border border-green-100 rounded">
                            <h4 class="font-bold text-xs text-green-400 uppercase mb-1">Column 2: Sympatheia</h4>
                            ${res.finalPlan.column2}
                        </div>
                        <div class="p-3 bg-amber-50 border border-amber-100 rounded">
                            <h4 class="font-bold text-xs text-amber-400 uppercase mb-1">Column 3: Peras</h4>
                            ${res.finalPlan.column3}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('detailsModal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('detailsModal').classList.add('hidden');
        };

        // Event Listeners
        document.getElementById('refreshBtn').addEventListener('click', fetchData);

        document.getElementById('sectionFilter').addEventListener('change', (e) => {
            const section = e.target.value;
            if (section === 'all') {
                renderTable(allResponses);
            } else {
                const filtered = allResponses.filter(r => r.student.section === section);
                renderTable(filtered);
            }
        });

        // Initial Load
        fetchData();
    </script>
</body>
</html>
