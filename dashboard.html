<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Student Responses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Student Response Dashboard</h1>
                <p class="text-gray-600">Module: Virtue, Harmony, and Sustainability</p>
            </div>
            <div class="flex gap-4">
                <button id="refreshBtn" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition">Refresh Data</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Total Submissions</p>
                <p id="totalSubmissions" class="text-3xl font-bold text-blue-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Last Submission</p>
                <p id="lastSubmission" class="text-lg font-semibold text-gray-700">None yet</p>
            </div>
             <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 text-sm text-gray-500 italic">
                Note: This dashboard requires access to the Firebase project.
            </div>
        </div>

        <!-- Filter -->
        <div class="bg-white p-4 rounded-t-xl border border-b-0 border-gray-200 flex gap-4 items-center">
            <label for="sectionFilter" class="font-bold text-gray-700">Filter by Section:</label>
            <select id="sectionFilter" class="border rounded px-3 py-1 bg-gray-50">
                <option value="all">All Sections</option>
                <option value="12 - Newton">12 - Newton</option>
                <option value="12 - Curie">12 - Curie</option>
                <option value="12 - Archerfish">12 - Archerfish</option>
            </select>
        </div>

        <!-- Responses Table -->
        <div class="bg-white rounded-b-xl shadow-md overflow-hidden border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Section</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quiz Score</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Submitted At</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="responseTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Data rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-[95vw] w-full max-h-[95vh] overflow-y-auto p-8 shadow-2xl">
            <div class="flex justify-between items-start mb-6">
                <h2 id="modalTitle" class="text-3xl font-bold text-blue-900">Submission Details</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-4xl font-bold leading-none">&times;</button>
            </div>
            <div id="modalContent" class="space-y-8">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCboBLLJa2L4_0bQMsFZhnlxFu-Djm0OLM",
          authDomain: "easyquizmaker.firebaseapp.com",
          projectId: "easyquizmaker",
          storageBucket: "easyquizmaker.firebasestorage.app",
          messagingSenderId: "45502490490",
          appId: "1:45502490490:web:6edcfe535ad10094cc58c3",
          measurementId: "G-C6PJBZ85E2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ANSWER_KEY = {
            q1: 'B', q2: 'A', q3: 'C', q4: 'B', q5: 'B',
            q6: 'B', q7: 'B', q8: 'B', q9: 'B', q10: 'B'
        };

        let allResponses = [];

        function calculateScore(quiz) {
            let score = 0;
            for (let i = 1; i <= 10; i++) {
                if (quiz[`q${i}`] === ANSWER_KEY[`q${i}`]) {
                    score++;
                }
            }
            return score;
        }

        async function fetchData() {
            const tableBody = document.getElementById('responseTableBody');
            tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading data...</td></tr>';

            try {
                const q = query(collection(db, "student_responses"), orderBy("submittedAt", "desc"));
                const querySnapshot = await getDocs(q);
                allResponses = [];

                querySnapshot.forEach((doc) => {
                    allResponses.push({ id: doc.id, ...doc.data() });
                });

                renderTable(allResponses);
                updateStats(allResponses);
            } catch (error) {
                console.error("Error fetching documents: ", error);
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500 font-bold">Error loading data. Check Firestore rules.</td></tr>';
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById('responseTableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No submissions found.</td></tr>';
                return;
            }

            data.forEach((res) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';

                const studentName = `${res.student.surname}, ${res.student.firstName} ${res.student.middleName || ''}`.toUpperCase();
                const date = res.submittedAt ? res.submittedAt.toDate().toLocaleString() : 'N/A';
                const quizScore = calculateScore(res.quiz);
                const activityTotal = res.activityScore ? (res.activityScore.c1 + res.activityScore.c2 + res.activityScore.c3) : 0;
                const totalScore = quizScore + activityTotal;

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${studentName}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">${res.student.section}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-blue-600">${totalScore} / 20 <span class="text-[10px] text-gray-400 font-normal ml-1">(Q: ${quizScore}, A: ${activityTotal})</span></td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-sm">${date}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <button onclick="window.viewDetails('${res.id}')" class="text-blue-600 hover:text-blue-900 font-bold">View & Grade</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateStats(data) {
            document.getElementById('totalSubmissions').innerText = data.length;
            if (data.length > 0 && data[0].submittedAt) {
                document.getElementById('lastSubmission').innerText = data[0].submittedAt.toDate().toLocaleString();
            } else {
                document.getElementById('lastSubmission').innerText = "None found";
            }
        }

        // Global functions for modal
        window.viewDetails = (id) => {
            const res = allResponses.find(r => r.id === id);
            if (!res) return;

            const quizScore = calculateScore(res.quiz);
            const savedScore = res.activityScore || { c1: 0, c2: 0, c3: 0 };
            
            const fullName = `${res.student.surname}, ${res.student.firstName} ${res.student.middleName || ''}`.toUpperCase();
            document.getElementById('modalTitle').innerText = fullName;
            const content = document.getElementById('modalContent');

            let quizHtml = '<div class="grid grid-cols-2 md:grid-cols-5 gap-2">';
            for (let i = 1; i <= 10; i++) {
                const answer = res.quiz[`q${i}`] || 'N/A';
                const isCorrect = answer === ANSWER_KEY[`q${i}`];
                const bgColor = isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200';
                quizHtml += `<div class="p-2 border rounded ${bgColor} text-center">
                    <span class="block text-xs font-bold text-gray-400">Q${i}</span>
                    <span class="text-lg font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}">${answer}</span>
                    ${!isCorrect ? `<span class="block text-[10px] text-gray-400">Key: ${ANSWER_KEY[`q${i}`]}</span>` : ''}
                </div>`;
            }
            quizHtml += '</div>';

            content.innerHTML = `
                <div class="flex justify-between items-center bg-blue-50 p-6 rounded-xl border border-blue-100">
                    <div>
                        <h3 class="font-bold text-blue-800 uppercase tracking-wide text-sm">Part A: Quiz Score</h3>
                        <p class="text-4xl font-black text-blue-600">${quizScore} <span class="text-base font-normal text-blue-400">/ 10 points</span></p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-gray-500 uppercase tracking-wide text-sm">Module Total Score</h3>
                        <p class="text-2xl font-bold text-gray-900"><span id="liveTotal">${quizScore + savedScore.c1 + savedScore.c2 + savedScore.c3}</span> / 20 Max</p>
                    </div>
                </div>

                <div class="border-b pb-6">
                    <h3 class="font-bold text-gray-700 uppercase mb-4 text-sm tracking-widest">Detailed Quiz Responses</h3>
                    ${quizHtml}
                </div>

                <div class="space-y-8">
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-4 bg-white border rounded-lg shadow-sm">
                                <h4 class="font-bold text-xs text-gray-400 uppercase mb-2">FA 1: The Chaos</h4>
                                <p class="text-gray-700 text-sm italic leading-relaxed">"${res.formativeAssessments.fa1.q1}"</p>
                            </div>
                            <div class="p-4 bg-white border rounded-lg shadow-sm">
                                <h4 class="font-bold text-xs text-gray-400 uppercase mb-2">FA 1: Reflection</h4>
                                <p class="text-gray-700 text-sm italic leading-relaxed">"${res.formativeAssessments.fa1.q2}"</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-4 bg-white border rounded-lg shadow-sm">
                                <h4 class="font-bold text-xs text-gray-400 uppercase mb-2">FA 2: Environmental Action</h4>
                                <p class="text-gray-700 text-sm italic leading-relaxed">"${res.formativeAssessments.fa2.q1}"</p>
                            </div>
                            <div class="p-4 bg-white border rounded-lg shadow-sm">
                                <h4 class="font-bold text-xs text-gray-400 uppercase mb-2">FA 2: Universal Sympathy</h4>
                                <p class="text-gray-700 text-sm italic leading-relaxed">"${res.formativeAssessments.fa2.q2}"</p>
                            </div>
                        </div>

                        <div class="p-4 bg-white border rounded-lg shadow-sm">
                            <h4 class="font-bold text-xs text-gray-400 uppercase mb-2">FA 3: Peras Choice Analysis</h4>
                            <p class="text-gray-700 text-sm italic leading-relaxed">"${res.formativeAssessments.fa3.q1}"</p>
                        </div>

                        <div class="bg-white border rounded-xl shadow-sm overflow-hidden">
                            <div class="bg-gray-800 text-white px-4 py-2 text-xs font-bold uppercase tracking-widest">Final Kosmos Plan</div>
                            <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x border-t">
                                <div class="p-5 bg-blue-50/30">
                                    <h5 class="font-bold text-[10px] text-blue-500 uppercase mb-2">Column 1: Kosmos (Aesthetic Order)</h5>
                                    <p class="text-sm text-gray-800">${res.finalPlan.column1}</p>
                                </div>
                                <div class="p-5 bg-green-50/30">
                                    <h5 class="font-bold text-[10px] text-green-500 uppercase mb-2">Column 2: Sympatheia (Care for Environment)</h5>
                                    <p class="text-sm text-gray-800">${res.finalPlan.column2}</p>
                                </div>
                                <div class="p-5 bg-amber-50/30">
                                    <h5 class="font-bold text-[10px] text-amber-500 uppercase mb-2">Column 3: Peras (Wise Limit)</h5>
                                    <p class="text-sm text-gray-800">${res.finalPlan.column3}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-8 border-t border-gray-100">
                        <div class="bg-gray-900 rounded-2xl p-6 text-white shadow-xl border border-gray-700">
                            <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-blue-400">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                Grading Panel
                            </h3>

                            <div class="space-y-4">
                                <div class="border-b border-gray-700 pb-3">
                                    <div class="flex justify-between items-center mb-2">
                                        <label for="c1_score" class="text-sm font-semibold">Philosophical Grounding</label>
                                        <select id="c1_score" class="bg-gray-800 text-white border border-gray-600 rounded px-2 py-1 text-sm focus:ring-blue-500" onchange="window.updateLiveTotal(${quizScore})">
                                            ${[0, 1, 2, 3, 4].map(v => `<option value="${v}" ${savedScore.c1 === v ? 'selected' : ''}>${v} pts</option>`).join('')}
                                        </select>
                                    </div>
                                    <p class="text-[10px] text-gray-400 italic">Core concepts: Kosmos, Demiurge, Sympatheia, Peras.</p>
                                </div>

                                <div class="border-b border-gray-700 pb-3">
                                    <div class="flex justify-between items-center mb-2">
                                        <label for="c2_score" class="text-sm font-semibold">Practical Clarity</label>
                                        <select id="c2_score" class="bg-gray-800 text-white border border-gray-600 rounded px-2 py-1 text-sm focus:ring-blue-500" onchange="window.updateLiveTotal(${quizScore})">
                                            ${[0, 1, 2, 3].map(v => `<option value="${v}" ${savedScore.c2 === v ? 'selected' : ''}>${v} pts</option>`).join('')}
                                        </select>
                                    </div>
                                    <p class="text-[10px] text-gray-400 italic">Actions are specific, realistic, and achievable.</p>
                                </div>

                                <div class="pb-3">
                                    <div class="flex justify-between items-center mb-2">
                                        <label for="c3_score" class="text-sm font-semibold">MELC Alignment</label>
                                        <select id="c3_score" class="bg-gray-800 text-white border border-gray-600 rounded px-2 py-1 text-sm focus:ring-blue-500" onchange="window.updateLiveTotal(${quizScore})">
                                            ${[0, 1, 2, 3].map(v => `<option value="${v}" ${savedScore.c3 === v ? 'selected' : ''}>${v} pts</option>`).join('')}
                                        </select>
                                    </div>
                                    <p class="text-[10px] text-gray-400 italic">Covers: Aesthetic organization, Health, Frugality.</p>
                                </div>
                            </div>

                            <button onclick="window.saveGrade('${res.id}')" id="saveGradeBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition mt-4 flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                Save Activity Grade
                            </button>
                        </div>

                        <div class="flex flex-col gap-6">
                            <div class="bg-blue-600 rounded-2xl p-6 text-white shadow-xl text-center flex-1 flex flex-col justify-center">
                                 <p class="text-xs text-blue-200 uppercase font-bold tracking-widest mb-1">Overall Module Grade</p>
                                 <p class="text-6xl font-black text-white italic"><span id="liveOverall">${quizScore + savedScore.c1 + savedScore.c2 + savedScore.c3}</span> <span class="text-2xl font-normal opacity-50">/ 20</span></p>
                            </div>
                            <div class="bg-white border rounded-2xl p-6 text-center shadow-sm">
                                <p class="text-sm font-bold text-gray-400 uppercase mb-2">Score Breakdown</p>
                                <div class="flex justify-around items-center">
                                    <div>
                                        <p class="text-xs text-gray-500">Quiz</p>
                                        <p class="text-xl font-bold text-blue-600">${quizScore}/10</p>
                                    </div>
                                    <div class="text-2xl text-gray-300">+</div>
                                    <div>
                                        <p class="text-xs text-gray-500">Activity</p>
                                        <p class="text-xl font-bold text-green-600"><span id="liveTotal">${savedScore.c1 + savedScore.c2 + savedScore.c3}</span>/10</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('detailsModal').classList.remove('hidden');
        };

        window.updateLiveTotal = (quizScore) => {
            const c1 = parseInt(document.getElementById('c1_score').value);
            const c2 = parseInt(document.getElementById('c2_score').value);
            const c3 = parseInt(document.getElementById('c3_score').value);
            const total = quizScore + c1 + c2 + c3;
            document.getElementById('liveTotal').innerText = total;
            document.getElementById('liveOverall').innerText = total;
        };

        window.saveGrade = async (id) => {
            const c1 = parseInt(document.getElementById('c1_score').value);
            const c2 = parseInt(document.getElementById('c2_score').value);
            const c3 = parseInt(document.getElementById('c3_score').value);
            
            const btn = document.getElementById('saveGradeBtn');
            btn.disabled = true;
            btn.innerText = "Saving...";

            try {
                const docRef = doc(db, "student_responses", id);
                await updateDoc(docRef, {
                    activityScore: { c1, c2, c3 }
                });
                
                // Update local data
                const resIndex = allResponses.findIndex(r => r.id === id);
                if (resIndex !== -1) {
                    allResponses[resIndex].activityScore = { c1, c2, c3 };
                }
                
                renderTable(allResponses);
                btn.innerText = "Grade Saved!";
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg> Save Activity Grade`;
                }, 2000);
            } catch (error) {
                console.error("Error updating grade: ", error);
                alert("Failed to save grade. Check your internet or Firestore rules.");
                btn.disabled = false;
                btn.innerText = "Save Activity Grade";
            }
        };

        window.closeModal = () => {
            document.getElementById('detailsModal').classList.add('hidden');
        };

        // Event Listeners
        document.getElementById('refreshBtn').addEventListener('click', fetchData);

        document.getElementById('sectionFilter').addEventListener('change', (e) => {
            const section = e.target.value;
            const filtered = section === 'all'
                ? allResponses
                : allResponses.filter(r => r.student.section === section);

            renderTable(filtered);
            updateStats(filtered);
        });

        // Initial Load
        fetchData();
    </script>
</body>
</html>
